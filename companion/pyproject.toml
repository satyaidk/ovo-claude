[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ovo-companion"
version = "1.0.0"
description = "Shows Claude Code activity on the OVO (MochiEyes) ESP32-C3 desk device"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []          # standard library only

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ovo-companion = "ovo_companion.cli:main"

[tool.setuptools]
packages = ["ovo_companion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
